name: CI Python

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

env:
  PIXI_COLOR: always

jobs:
  build_and_test:
    name: Python project - ${{ matrix.python-environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-environment: ['py310', 'py311', 'py312', 'py313']
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.python-environment }}
      - run: pixi run -e ${{ matrix.python-environment }} test
  benchmarks:
    name: Python benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: py-phylo2vec
      - run: pixi run -e py-phylo2vec benchmark
  notebooks:
    name: Test notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: py-phylo2vec
      - name: Install package and dependencies
        run: |
          pixi run -e py-phylo2vec install-python
          pixi run -e py-phylo2vec pip install nbconvert
      # optimisation.ipynb is skipped as it needs the [gradme] extras, RAxML-NG and R
      - name: Execute notebooks
        run: |
          cd docs/notebooks
          pixi run -e py-phylo2vec jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP" \
            getting-started.ipynb core-concepts.ipynb tree-operations.ipynb statistics.ipynb
